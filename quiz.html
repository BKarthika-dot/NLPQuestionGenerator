<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Question Lab · Quiz Mode</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
:root{--ink:#332b38;--muted:#8d8190;--cream:#fbf4ec;--lav:#e7dbe5;--purple:#75586f;--rose:#d97e9f;--line:#ddd1db;--good:#438b7e;--bad:#a34f5f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4eee8;color:var(--ink);font-family:'DM Sans',sans-serif}button,input{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:224px 1fr;background:var(--cream)}aside{background:#f0e7e2;padding:30px 20px 24px;display:flex;flex-direction:column}.brand{font:800 25px 'Plus Jakarta Sans';margin:0 10px 28px}.profile{display:flex;align-items:center;gap:10px;padding:15px 10px 26px;border-bottom:1px solid #ded1d5}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#d18f73;color:white;font-size:20px;font-weight:700}.profile strong{display:block;font-size:13px}.profile small{color:var(--muted);font-size:11px}nav{margin-top:20px;display:grid;gap:7px}nav a{color:#786b78;text-decoration:none;padding:12px 13px;border-radius:13px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:12px}nav a.active,nav a:hover{color:var(--ink);background:#dfd0dc}.nav-icon{width:18px;text-align:center;font-size:17px}main{min-width:0;padding:34px 40px}.topbar{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}h1,h2,p{margin:0}h1{font:700 27px 'Plus Jakarta Sans';letter-spacing:-1px}h2{font:700 17px 'Plus Jakarta Sans'}.intro{color:var(--muted);font-size:13px;margin-top:6px}.back{color:var(--purple);font-size:11px;font-weight:700;text-decoration:none;padding-top:8px}.panel{background:var(--lav);border-radius:16px;padding:20px;max-width:900px}.meta{color:var(--muted);font-size:11px;margin-top:6px}.progress{height:7px;background:#d3c1d0;border-radius:8px;overflow:hidden;margin:20px 0}.progress span{display:block;height:100%;width:0;background:var(--purple);transition:width .25s}.question{background:#f8eff0;border:1px solid #e0d0d8;border-radius:12px;padding:18px}.question h2{font-size:18px;line-height:1.4}.answer{width:100%;min-height:120px;margin-top:16px;padding:12px;border:1px solid #d2c0cf;border-radius:10px;background:#fff8f5;color:var(--ink);resize:vertical;outline:none}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.button{border:0;border-radius:10px;padding:11px 15px;color:white;background:var(--purple);cursor:pointer;font-weight:700;font-size:12px}.button:disabled{opacity:.45;cursor:not-allowed}.button.secondary{background:#c9b8c5;color:var(--ink)}.error{color:var(--bad);font-size:12px;margin-top:10px}.results{display:none}.results.show{display:block}.score{font:800 40px 'Plus Jakarta Sans';color:var(--purple);margin:15px 0}.weak{display:grid;gap:8px;margin-top:12px}.weak div{background:#f8eff0;border:1px solid #e0d0d8;border-radius:9px;padding:10px;font-size:12px}@media(max-width:900px){.app{grid-template-columns:76px 1fr}aside{padding:22px 10px;align-items:center}.brand{font-size:0;margin:0 0 20px}.brand:after{content:'Q';font-size:25px}.profile{padding:10px 0 20px;border:0}.profile div:last-child,nav a span:not(.nav-icon){display:none}nav a{padding:12px}main{padding:25px 20px}}@media(max-width:620px){.topbar{align-items:flex-start}h1{font-size:23px}}
</style></head>
<body><div class="app"><aside><div class="brand">Question Lab</div><div class="profile"><div class="avatar">K</div><div><strong>Welcome back</strong><small>Question creator</small></div></div><nav><a href="/"><span class="nav-icon">▦</span><span>Dashboard</span></a><a href="/my-materials"><span class="nav-icon">⌂</span><span>My materials</span></a><a href="/#results"><span class="nav-icon">▤</span><span>My questions</span></a><a class="active" href="/quiz"><span class="nav-icon">✓</span><span>Quiz Mode</span></a><a href="/evaluate"><span class="nav-icon">≋</span><span>Answer Evaluation</span></a></nav></aside><main><div class="topbar"><div><h1>QUIZ MODE</h1><p class="intro">Answer each question, then get a self-graded result.</p></div><a class="back" href="/">← Dashboard</a></div><section id="picker" class="panel"><h2>Choose a question set</h2><p class="intro">Select a generated material to begin.</p><select id="material-select" class="answer" style="min-height:auto" aria-label="Question set"></select><button id="start" class="button" style="margin-top:12px">Start quiz</button><p id="picker-error" class="error"></p></section><section id="quiz-panel" class="panel" hidden><div id="progress-label" class="meta"></div><div class="progress"><span id="progress-fill"></span></div><div class="question"><h2 id="question-text"></h2><textarea id="answer" class="answer" placeholder="Write your answer..."></textarea></div><div class="actions"><button id="previous" class="button secondary" disabled>Previous</button><button id="next" class="button">Next</button></div><p id="quiz-error" class="error"></p></section><section id="results" class="panel results"><h2>Quiz complete</h2><div id="score" class="score"></div><p id="accuracy" class="intro"></p><h2 style="margin-top:22px">Weak Areas</h2><div id="weak" class="weak"></div><button id="restart" class="button" style="margin-top:18px">Take quiz again</button></section></main></div>
<script>
const select=document.getElementById('material-select'),picker=document.getElementById('picker'),quizPanel=document.getElementById('quiz-panel'),results=document.getElementById('results'),questionText=document.getElementById('question-text'),answer=document.getElementById('answer'),progressLabel=document.getElementById('progress-label'),progressFill=document.getElementById('progress-fill'),previous=document.getElementById('previous'),next=document.getElementById('next'),quizError=document.getElementById('quiz-error');let material=null,questions=[],current=0,answers=[];
function escapeHtml(value){return String(value??'').replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;'}[c]))}
async function loadMaterials(){const response=await fetch('/materials');const payload=await response.json();const list=payload.materials||[];select.innerHTML=list.length?list.map(item=>`<option value="${escapeHtml(item.id)}">${escapeHtml(item.filename)}</option>`).join(''):'<option value="">No materials available</option>';const requested=new URLSearchParams(location.search).get('material_id');if(requested&&list.some(item=>item.id===requested))select.value=requested;}
async function startQuiz(){const id=select.value;if(!id)return;const response=await fetch(`/materials/${encodeURIComponent(id)}`);if(!response.ok){document.getElementById('picker-error').textContent='Could not load this material.';return}material=await response.json();questions=material.data.questions||[];if(!questions.length){document.getElementById('picker-error').textContent='This material has no questions.';return}current=0;answers=JSON.parse(localStorage.getItem(`question-lab-quiz-${id}`)||'[]');picker.hidden=true;results.classList.remove('show');quizPanel.hidden=false;renderQuestion();}
function renderQuestion(){const item=questions[current];progressLabel.textContent=`Question ${current+1}/${questions.length}`;progressFill.style.width=`${((current+1)/questions.length)*100}%`;questionText.textContent=item.question;answer.value=answers[current]?.student_answer||'';previous.disabled=current===0;next.textContent=current===questions.length-1?'Finish':'Next';quizError.textContent='';}
async function submitAnswer(){const text=answer.value.trim();if(!text){quizError.textContent='Write an answer before continuing.';return}next.disabled=true;quizError.textContent='Checking answer...';const response=await fetch('/evaluate-answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({material_id:material.id,question_index:current,student_answer:text})});const payload=await response.json();next.disabled=false;if(!response.ok){quizError.textContent=payload.detail||'Answer could not be evaluated.';return}answers[current]={student_answer:text,...payload};localStorage.setItem(`question-lab-quiz-${material.id}`,JSON.stringify(answers));if(current===questions.length-1)showResults();else{current++;renderQuestion();}}
function showResults(){quizPanel.hidden=true;results.classList.add('show');const correct=answers.filter(item=>item&&item.correct).length;const total=answers.reduce((sum,item)=>sum+(item?.score||0),0);document.getElementById('score').textContent=`${total}/${questions.length*10}`;document.getElementById('accuracy').textContent=`${correct}/${questions.length} correct · ${Math.round(correct/questions.length*100)}% accuracy`;const weak=new Map();answers.forEach((item,index)=>{if(!item||item.correct)return;const sections=(questions[index].source||[]).map(source=>source.section).filter(Boolean);(sections.length?sections:['Question '+(index+1)]).forEach(section=>weak.set(section,(weak.get(section)||0)+1));});document.getElementById('weak').innerHTML=weak.size?[...weak].map(([name,count])=>`<div>${escapeHtml(name)} <span class="meta">(${count} missed)</span></div>`).join(''):'<div>No weak areas detected.</div>';}
previous.addEventListener('click',()=>{if(current>0){current--;renderQuestion()}});next.addEventListener('click',submitAnswer);document.getElementById('start').addEventListener('click',startQuiz);document.getElementById('restart').addEventListener('click',()=>{localStorage.removeItem(`question-lab-quiz-${material.id}`);answers=[];current=0;results.classList.remove('show');quizPanel.hidden=false;renderQuestion()});loadMaterials().catch(()=>document.getElementById('picker-error').textContent='Could not load materials.');
</script></body></html>
