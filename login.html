<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Question Lab · Admin Login</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
:root{--ink:#332b38;--muted:#8d8190;--cream:#fbf4ec;--lav:#e7dbe5;--purple:#75586f;--bad:#a34f5f}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4eee8;color:var(--ink);font-family:'DM Sans',sans-serif}
button,input{font:inherit}
.card{width:100%;max-width:380px;background:var(--lav);border-radius:18px;padding:30px 26px;margin:20px}
.brand{font:800 22px 'Plus Jakarta Sans';letter-spacing:-1px;margin:0}
.subtitle{color:var(--muted);font-size:13px;margin-top:6px}
label{display:block;font-size:11px;font-weight:700;color:#827581;margin-top:18px}
.field{display:block;width:100%;padding:11px;margin-top:8px;border:1px solid #d2c0cf;border-radius:9px;background:#fff8f5;color:var(--ink)}
.button{width:100%;border:0;border-radius:10px;padding:12px;color:white;background:var(--purple);cursor:pointer;font-weight:700;font-size:13px;margin-top:20px}
.button:disabled{opacity:.5;cursor:not-allowed}
.error{color:var(--bad);font-size:12px;margin-top:12px}
.footer-link{display:block;text-align:center;margin-top:18px;color:var(--purple);font-size:11px;font-weight:700;text-decoration:none}
</style></head>
<body>
<form class="card" id="login-form">
    <h1 class="brand">Question Lab</h1>
    <p class="subtitle">Sign in to manage materials, exams, and grading.</p>
    <label for="username">Username</label>
    <input id="username" class="field" autocomplete="username" required />
    <label for="password">Password</label>
    <input id="password" class="field" type="password" autocomplete="current-password" required />
    <button id="submit" class="button" type="submit">Log in</button>
    <p id="error" class="error"></p>
    <a class="footer-link" href="/student-login">Looking to take an exam? Student login →</a>
</form>
<script>
const form=document.getElementById('login-form'),submitButton=document.getElementById('submit'),error=document.getElementById('error');
form.addEventListener('submit', async event => {
    event.preventDefault();
    error.textContent='';
    submitButton.disabled=true;submitButton.textContent='Signing in...';
    try{
        const response=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});
        const payload=await response.json();
        if(!response.ok)throw new Error(payload.detail||'Login failed.');
        const next=new URLSearchParams(location.search).get('next')||'/';
        window.location.href=next;
    }catch(e){
        error.textContent=e.message;
        submitButton.disabled=false;submitButton.textContent='Log in';
    }
});
</script>
</body>
</html>
